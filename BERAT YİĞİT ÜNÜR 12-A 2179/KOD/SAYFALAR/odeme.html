  const city = this.value;
  districtSelect.innerHTML = "";
  if(!districts[city]){ districtSelect.innerHTML="<option>İlçe bulunamadı</option>"; return; }
  districts[city].forEach(d=>{
    const option = document.createElement("option");
    option.value = d; option.textContent = d;
    districtSelect.appendChild(option);
  });
});

// Kart önizleme
document.getElementById("cardNumber").addEventListener("input", e=>{
  let val = e.target.value.replace(/\D/g,'').substring(0,16);
  val = val.replace(/(.{4})/g,'$1 ').trim();
  e.target.value = val;
  document.getElementById("cardPreview").innerText = val || "0000 0000 0000 0000";
});
document.getElementById("expiry").addEventListener("input", e=>{
  let val = e.target.value.replace(/\D/g,'').substring(0,4);
  if(val.length>2) val = val.substring(0,2)+"/"+val.substring(2);
  e.target.value = val;
  document.getElementById("datePreview").innerText = val || "AA/YY";
});
document.getElementById("cardName").addEventListener("input", e=>{
  document.getElementById("namePreview").innerText = e.target.value.toUpperCase()||"AD SOYAD";
});

// Sipariş özeti
document.addEventListener("DOMContentLoaded", function(){
  const summary = document.getElementById("summary");
  const totalEl = document.getElementById("total-price");
  const cart = getCart();
  summary.innerHTML="";
  if(cart.length===0){ summary.innerHTML="<p>Sepet boş.</p>"; totalEl.innerText="0₺"; return; }
  let total=0;
  cart.forEach(item=>{
    const itemTotal = Number(item.price)*Number(item.quantity);
    total+=itemTotal;
    summary.innerHTML+=`<div class="summary-row"><span>${item.name} x${item.quantity}</span><span>${itemTotal}₺</span></div>`;
  });
  totalEl.innerText=total+"₺";
});

// Ödeme tamamla
function odemeTamamla() {
  const name = document.getElementById("cardName").value;
  const address = document.querySelector("input[placeholder='Adres']").value;
  const city = document.getElementById("city").value;
  const district = document.getElementById("district").value;
  const postal = document.querySelector("input[placeholder='Posta Kodu']").value;

  const customerData = { name, address, city, district, postal };
  localStorage.setItem("customerData", JSON.stringify(customerData));

  const success = document.getElementById("success");
  const popup = document.getElementById("popup");

  // Animasyonu resetle
  popup.style.animation = "none";
  popup.style.opacity = "1";
  void popup.offsetHeight; // reflow

  success.style.display = "flex";
  popup.style.animation = "pop 0.5s forwards";

  // 1.5 saniye sonra fatura.html
  setTimeout(() => {
    window.location.href = "fatura.html";
  }, 1500);
}
</script>
